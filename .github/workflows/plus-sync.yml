# Immich TV Plus: keeps the fork in sync with giejay/Immich-Android-TV and publishes a signed APK.
#
#  main  = exact copy of upstream main (fast-forward only)
#  plus  = main + our additions (default branch, releases are built from here)
#
# Secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Optional: PLUS_SYNC_TOKEN (fine-grained token with Contents + Workflows write on this repo).
#           Without it GitHub refuses pushes that touch upstream's .github/workflows files.
name: Plus - sync upstream and release

on:
  schedule:
    - cron: '0 2 * * *' # daily 04:00 CEST
  workflow_dispatch:
  push:
    branches: [ plus ]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: plus-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/giejay/Immich-Android-TV.git
  APK_NAME: ImmichTVPlus.apk
  CONFLICT_TITLE: Sync-Konflikt mit dem Original

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plus
          fetch-depth: 0
          token: ${{ secrets.PLUS_SYNC_TOKEN || github.token }}

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/plus-sync.yml/enable" || true

      - name: Fast-forward main to upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse upstream/main)" ]; then
            # main is only a mirror, plus merges upstream/main directly, so a refused push is not fatal
            git push origin upstream/main:refs/heads/main || echo "::warning::main konnte nicht aktualisiert werden, siehe PLUS_SYNC_TOKEN"
          fi

      - name: Merge upstream into plus
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "plus already contains upstream/main"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            if git push origin HEAD:plus; then
              exit 0
            fi
            reason="GitHub hat den Push abgelehnt. Meist hat das Original Dateien unter .github/workflows geändert. Dafür braucht der Workflow das Secret PLUS_SYNC_TOKEN (fine-grained Token für dieses Repository mit Contents und Workflows: Read and write)."
            files=$(git diff --name-only HEAD^1 HEAD -- .github/workflows)
          else
            reason="Das Original hat dieselben Stellen geändert wie Immich TV Plus (Merge-Konflikt)."
            files=$(git diff --name-only --diff-filter=U)
            git merge --abort
          fi

          open=$(gh issue list --state open --search "\"$CONFLICT_TITLE\" in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            {
              echo "Der automatische Abgleich mit dem Original ist gescheitert. Es wurde nichts veröffentlicht, die bisherige APK bleibt gültig."
              echo
              echo "Grund: $reason"
              echo
              echo "Betroffene Dateien:"
              echo "$files" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Lösen:"
              echo '```bash'
              echo "git checkout plus && git pull"
              echo "git fetch $UPSTREAM main && git merge FETCH_HEAD"
              echo "# Konflikte lösen, dann"
              echo "git commit && git push"
              echo '```'
            } > issue.md
            gh issue create --title "$CONFLICT_TITLE" --body-file issue.md
          fi
          exit 1

      - name: Decide whether a release is needed
        id: plan
        run: |
          if git tag --points-at HEAD | grep -q '^plus-'; then
            echo "This commit is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upstream_code=$(grep -m1 'versionCode' app/build.gradle | grep -o '[0-9]\+')
          last=$(git tag --list "plus-${upstream_code}[0-9][0-9][0-9]" | sed 's/^plus-//' | sort -n | tail -1)
          if [ -z "$last" ]; then
            build=1
          else
            build=$(( last - upstream_code * 1000 + 1 ))
          fi
          upstream_name=$(grep -m1 'versionName' app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "code=$(( upstream_code * 1000 + build ))" >> "$GITHUB_OUTPUT"
          echo "name=${upstream_name}-plus.${build}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.plan.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build signed APK
        if: steps.plan.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLUS_BUILD_NUMBER: ${{ steps.plan.outputs.build }}
          PLUS_UPDATE_REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 fehlt"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp "$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)" "$APK_NAME"

      - name: Publish release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="plus-${{ steps.plan.outputs.code }}"
          previous=$(git tag --list 'plus-*' | sort -V | tail -1)
          {
            echo "Basiert auf giejay/Immich-Android-TV $(git rev-parse --short upstream/main)."
            echo
            echo "Änderungen:"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous"..HEAD | head -40
            else
              git log --no-merges --pretty='- %s' -20
            fi
          } > notes.md
          gh release create "$tag" "$APK_NAME" \
            --target "$(git rev-parse HEAD)" \
            --title "Immich TV Plus ${{ steps.plan.outputs.name }}" \
            --notes-file notes.md \
            --latest
